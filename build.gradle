plugins {
    id 'java'
    id 'application'
    id 'checkstyle'
    id 'jacoco'
    id 'com.gradleup.shadow' version '9.5.1'
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

repositories {
    mavenCentral()
}

dependencies {
    String jUnitVersion = '5.14.4'

    testImplementation "org.junit.jupiter:junit-jupiter-api:${jUnitVersion}"
    testImplementation "org.junit.jupiter:junit-jupiter-params:${jUnitVersion}"

    testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:${jUnitVersion}"
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.14.4'
}

test {
    useJUnitPlatform()
    enableAssertions = true

    testLogging {
        events 'passed', 'skipped', 'failed'

        showExceptions = true
        exceptionFormat = 'full'
        showCauses = true
        showStackTraces = true
        showStandardStreams = false
    }
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
    }
}

jacocoTestCoverageVerification {
    dependsOn test
    violationRules {
        rule {
            element = 'CLASS'
            includes = [
                    'seedu.snap.bundle.BundleHandler',
                    'seedu.snap.eqmmanager.EqmManager',
                    'seedu.snap.equipment.EquipmentFields',
                    'seedu.snap.equipment.EquipmentFilter',
                    'seedu.snap.equipment.EquipmentHandler',
                    'seedu.snap.equipment.EquipmentStorage',
                    'seedu.snap.loan.LoanBorrowerQuery',
                    'seedu.snap.loan.LoanHandler',
                    'seedu.snap.loan.LoanReturn',
                    'seedu.snap.loan.LoanUpdate',
                    'seedu.snap.maintenance.MaintenanceHandler',
                    'seedu.snap.parser.CommandAliases',
                    'seedu.snap.ui.BundleView',
                    'seedu.snap.ui.EquipmentView',
                    'seedu.snap.ui.Help'
            ]
            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = 0.95
            }
        }
    }
}

check.dependsOn jacocoTestCoverageVerification

application {
    mainClass = 'seedu.snap.Main'
}

jar {
    // A lean JAR file (i.e., without the dependencies packaged inside) is not needed.
    enabled = false
    // Rename its output anyway; Gradle forbids it clashing with the shadowJar output file, even for a disabled task.
    archiveClassifier = 'without-dependencies'
}

shadowJar {
    archiveFileName = 'snAp.jar'
}

checkstyle {
    toolVersion = '14.1.0'
}

jacoco {
    toolVersion = '0.8.15'
}

def typedIdentifierClasses = [
        'seedu.snap.Identifier',
        'seedu.snap.bundle.Bundle',
        'seedu.snap.bundle.BundleHandler',
        'seedu.snap.bundle.BundleStorage',
        'seedu.snap.equipment.Battery',
        'seedu.snap.equipment.Equipment',
        'seedu.snap.equipment.EquipmentFilter',
        'seedu.snap.equipment.EquipmentHandler',
        'seedu.snap.equipment.EquipmentStorage',
        'seedu.snap.equipment.Lens',
        'seedu.snap.loan.Loan',
        'seedu.snap.loan.LoanBorrowerQuery',
        'seedu.snap.loan.LoanHandler',
        'seedu.snap.loan.LoanReturn',
        'seedu.snap.loan.LoanStorage',
        'seedu.snap.loan.LoanUpdate',
        'seedu.snap.maintenance.MaintenanceHandler',
        'seedu.snap.ui.EquipmentView',
        'seedu.snap.ui.Help'
]

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
    }
}

jacocoTestCoverageVerification {
    dependsOn test
    violationRules {
        rule {
            element = 'CLASS'
            includes = typedIdentifierClasses
            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = 0.95
            }
        }
    }
}

check.dependsOn jacocoTestCoverageVerification

run {
    standardInput = System.in
    enableAssertions = true
}
